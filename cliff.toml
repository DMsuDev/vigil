# git-cliff ~ Configuration
# Official docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Conventional Commits](https://www.conventionalcommits.org/)
and this project adheres to [Semantic Versioning](https://semver.org/).
"""

body = """
{% if version %}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
  ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
    - {% if commit.scope %}*{{ commit.scope }}*: {% endif %}\
        {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/DMsuDev/Vigil/commit/{{ commit.id }}))\
    {% if commit.body %}

      {{ commit.body | trim | indent(prefix="  ", first=true) }}\
    {% endif %}
  {% endfor %}
{%- endfor %}
"""

footer = """

<!-- generated by git-cliff -->
"""

# Remove leading and trailing whitespaces from the changelog's body.
trim = true

# Render body even when there are no releases to process.
render_always = true

# Postprocessors clean up the final rendered output as plain text.
# Here we strip the <!-- N --> tags used only to force the ordering
# of the groups (see explanation below).
postprocessors = [
  { pattern = '<!-- \\d+ -->', replace = "" },
]

[git]
# --- Commit parsing ---

# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true

# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true

# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false

# Split commits on newlines, treating each line as an individual commit.
split_commits = false

# Preprocessors: transform the commit TEXT before it's parsed/grouped.
commit_preprocessors = [
  # Example: auto-link issue/PR references if you ever use them
  # { pattern = '\\((\\w+\\s)?#([0-9]+)\\)', replace = "([#${2}](https://github.com/DMsuDev/vigil/issues/${2}))" },
]

# Prevents a "breaking" commit from being dropped if it also matches a
# parser with `skip = true`. Keep this on whenever you use BREAKING CHANGE.
protect_breaking_commits = true

# --- Parsers: which group each commit goes to, based on type/scope/body ---
# The "<!-- N -->" prefix is an official git-cliff trick: it exists only to
# fix the ORDER in which sections appear (stripped later by the
# postprocessor above). Without it, groups would come out alphabetically.
commit_parsers = [
  # ==========================================================================
  # Ignored commits (evaluated first)
  # ==========================================================================

  # Ignore changelog commits
  { message = "^docs\\(changelog\\):", skip = true },
  { message = ".*CHANGELOG\\.md.*", skip = true },

  # chore(release): ... is generated by git-cliff/bump itself -> must not show up
  { message = "^chore\\(release\\): prepare for", skip = true },

  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },

  { message = "^style", skip = true },

  # ==========================================================================
  # Commit groups
  # ==========================================================================

  { breaking = true,                 group = "<!-- 00 -->💥 Breaking Changes" },
  { message = "^chore\\(project\\)", group = "<!-- 01 -->🏗️ Project Setup" },
  { message = "^feat",               group = "<!-- 02 -->🚀 Features" },
  { message = "^fix",                group = "<!-- 03 -->🐛 Bug Fixes" },
  { message = "^refactor",           group = "<!-- 04 -->🚜 Refactor" },
  { message = "^perf",               group = "<!-- 05 -->⚡ Performance" },
  { message = "^build",              group = "<!-- 06 -->🛠️ Build System" },

  { message = "^docs\\(api\\)",      group = "<!-- 07 -->📚 Documentation" },
  { message = "^docs", skip = true },

  { message = "^(chore|ci|test)",    group = "<!-- 08 -->🔧 Maintenance" },
  { body = "(?i)security",           group = "<!-- 09 -->🛡️ Security" },
  { message = "^revert",             group = "<!-- 10 -->◀️ Reverts" },

  # ==========================================================================
  # Catch-all (must remain last)
  # ==========================================================================
  # Safety net: anything that didn't match above. Parsers are evaluated in
  # order and the first matching rule wins, so this rule must always be last.
  { message = ".*", group = "<!-- 11 -->💼 Other" },
]

# Exclude commits that are not matched by any commit parser.
filter_commits = false

# If true, fails the command when an unclassified commit is found.
fail_on_unmatched_commit = false

# Turns references (issue/PR/RFC...) into clickable links.
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/DMsuDev/vigil/issues/$1" },
]

# Only include tags reachable from the current branch
use_branch_tags = false

# Topological order (based on the commit graph) instead of pure chronological,
# for both tags and commits within each release
topo_order = false
topo_order_commits = true

# Order of commits WITHIN each group/section: "oldest" or "newest"
sort_commits = "oldest"

# Also analyze commits from submodules
recurse_submodules = false

# --- Tags ---

# Regex that tags must match to count as valid versions
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

# Tags that are IGNORED entirely (neither counted nor shown)
skip_tags = "v0\\.0\\.*|.*-alpha.*|.*-beta.*|.*-rc.*"

# Tags that don't get their own section, but whose commits are carried
# forward into the next valid tag (useful for intermediate test tags)
ignore_tags = ""

[bump]
# Initial version if the repo has no tags yet
initial_tag = "0.1.0"

# feat: always bumps MINOR (standard semver behavior already does this,
# this just makes it explicit)
features_always_bump_minor = true

# A "breaking" commit always bumps MAJOR, even if it's a fix! or chore!
breaking_always_bump_major = true

# Additional types, outside feat/fix/BREAKING CHANGE, that you want to
# trigger a specific bump. Example (commented out): treat any "perf"
# commit as bumping minor, same as a feat.
# custom_minor_increment_regex = "^perf"
