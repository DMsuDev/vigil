name: "Publish Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
        default: "v0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BUILD_DIR: build
  INSTALL_DIR: install
  PROJECT_NAME: Vigil

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Validate the release tag format (must be strict SemVer)
  # ---------------------------------------------------------------------------
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest

    steps:
      - name: Resolve and validate tag
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${RELEASE_TAG}' is not a valid semantic version (vX.Y.Z)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 1: Build and package each platform
  # ---------------------------------------------------------------------------
  build:
    name: Package (${{ matrix.platform }})
    needs: validate-tag

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz

          - os: windows-latest
            platform: windows-x64
            archive: zip

          - os: macos-latest
            platform: macos-arm64
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Install fmt (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libfmt-dev

      - name: Install fmt (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install fmt

      - name: Install fmt (Windows)
        if: matrix.os == 'windows-latest'
        run: vcpkg install fmt:x64-windows-static
        shell: pwsh

      - name: Configure (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DVIGIL_INSTALL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DVIGIL_BUILD_EXAMPLES=OFF \
            -DVIGIL_BUILD_TESTS=OFF

      - name: Configure (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DVIGIL_INSTALL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DVIGIL_BUILD_EXAMPLES=OFF \
            -DVIGIL_BUILD_TESTS=OFF

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B "${env:BUILD_DIR}" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:INSTALL_DIR}" `
            -DVIGIL_INSTALL=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DVIGIL_BUILD_EXAMPLES=OFF `
            -DVIGIL_BUILD_TESTS=OFF

      - name: Build
        shell: bash
        run: cmake --build "${BUILD_DIR}" --config Release --parallel

      - name: Install
        shell: bash
        run: cmake --install "${BUILD_DIR}" --config Release

      - name: Set package name
        shell: bash
        run: |
          echo "PACKAGE_NAME=${PROJECT_NAME}-${RELEASE_TAG}-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "${PACKAGE_NAME}.tar.gz" -C "${INSTALL_DIR}" .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${env:INSTALL_DIR}\*" `
            -DestinationPath "${env:PACKAGE_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Collect artifacts, generate checksums and publish the release
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          find . -maxdepth 1 \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
