name: "Publish Release"

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vX.Y.Z)"
        required: true
        default: "v0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_DIR: build
  INSTALL_DIR: install
  PROJECT_NAME: Vigil

jobs:
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest

    steps:
      - name: Check strict SemVer
        shell: bash
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not a valid semantic version (vX.Y.Z)"
            exit 1
          fi

  build:
    name: Package (${{ matrix.platform }})
    needs: validate-tag

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz

          - os: windows-latest
            platform: windows-x64
            archive: zip

          - os: macos-latest
            platform: macos
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfmt-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install fmt

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install fmt -y

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PREFIX_PATH="C:/ProgramData/chocolatey"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            PREFIX_PATH="/opt/homebrew"
          else
            PREFIX_PATH="/usr"
          fi

          cmake \
            -S . \
            -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${PREFIX_PATH}" \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DVIGIL_INSTALL=ON \
            -DVIGIL_USE_SYSTEM_FMT=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DVIGIL_BUILD_EXAMPLES=OFF \
            -DVIGIL_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config Release --parallel

      - name: Install
        run: cmake --install "${BUILD_DIR}" --config Release

      - name: Set package name
        shell: bash
        run: |
          echo "PACKAGE_NAME=${PROJECT_NAME}-${{ github.ref_name }}-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -czf "${PACKAGE_NAME}.tar.gz" -C "${INSTALL_DIR}" .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${env:INSTALL_DIR}\*" `
            -DestinationPath "${env:PACKAGE_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          draft: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
