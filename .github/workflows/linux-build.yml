name: "Build (Linux)"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/linux-build.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/linux-build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: >-
      Linux ${{ matrix.compiler }} C++${{ matrix.standard }} ${{ matrix.build_type }} ${{ matrix.shared && 'Shared' || 'Static' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        compiler: [gcc, clang]
        standard: [20, 23]
        shared: ["", "-DBUILD_SHARED_LIBS=ON"]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.shared }}

      - name: Build
        run: >
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: >
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120
