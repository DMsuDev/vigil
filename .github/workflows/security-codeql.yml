name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/security-codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/security-codeql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Analyze - build the project so CodeQL can trace compiled C++ code
  # ---------------------------------------------------------------------------
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

        with:
          languages: cpp
          # Manual build mode: we control exactly what gets compiled and
          # analyzed, instead of relying on autobuild to guess our CMake setup.
          build-mode: manual

          # Analyze only project source code.
          config: |
            paths:
              - src
              - include

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DVIGIL_BUILD_TESTS=ON \
            -DVIGIL_INSTALL=OFF

      - name: Build
        run: cmake --build build --parallel

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:cpp"
