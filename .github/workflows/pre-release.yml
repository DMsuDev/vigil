name: "Prerelease"

on:
  push:
    tags:
      - "v*-WIP"
      - "v*-dev"
      - "v*.WIP"
      - "v*.dev"

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prerelease:
    name: Create prerelease
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate tag carries prerelease suffix
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "${TAG}" =~ [-\.](WIP|dev)$ ]]; then
            echo "::error::Tag '${TAG}' does not carry a prerelease suffix (-WIP, -dev, .WIP, .dev)"
            exit 1
          fi

      - name: Find previous tag
        id: prev_tag
        shell: bash
        run: |
          CURRENT="${{ github.ref_name }}"

          PREV=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([.-](WIP|dev))?$' \
            | grep -Fxv "${CURRENT}" \
            | head -1)

          if [[ -z "${PREV}" ]]; then
            echo "::error::No previous tag found. Cannot determine changes for this prerelease."
            exit 1
          fi

          echo "Previous tag: ${PREV}"
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        shell: bash
        run: |
          PREV="${{ steps.prev_tag.outputs.tag }}"
          CURRENT="${{ github.ref_name }}"

          git cliff "${PREV}..${CURRENT}" --tag "${CURRENT}" -o CHANGES.md

          cat CHANGES.md

      - name: Publish prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} (prerelease)"
          body_path: CHANGES.md
          prerelease: true
