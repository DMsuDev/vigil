name: "Feature Request"
description: "Suggest a new feature or improvement."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting a feature request, please keep the following in mind.

        - **Search [open](https://github.com/DMsuDev/vigil/issues) and [closed](https://github.com/DMsuDev/vigil/issues?q=is%3Aissue+is%3Aclosed) issues** to check if the feature has already been suggested.
        - **Be specific** about what you want and why. Vague requests are harder to evaluate and implement.

        ---

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear description of the feature or improvement you'd like to see."
      placeholder: "What should be added or changed?"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Motivation / Use Case"
      description: "Why would this be useful? What problem does it solve or what workflow does it enable?"
      placeholder: "This would help because..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any workarounds or alternative approaches you have already tried or thought of."
      placeholder: "(optional)"
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: "Screenshots / References"
      description: "Attach any mockups, diagrams, or references that help illustrate the idea."
      placeholder: "(drag and drop files here)"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest this, all feedback is appreciated.
